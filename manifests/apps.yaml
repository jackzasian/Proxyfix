# Proxyfix manifest — single source of truth for Clash fake-ip-filter and DIRECT rules.
# Parsed by lib/patch-clash.sh and bin/proxyfix-download.

# `auto` resolves the active subscription's merge profile from Clash Verge's
# profiles.yaml. Override with a filename (e.g. Merge.yaml) to pin it.
merge_profile: auto
rules_profile: auto

fake_ip_filter:
  # Always present (security / LAN)
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - 'geoip:cn'
  # Arch / Omarchy / pacman / git
  - '+.archlinux.org'
  - '+.archlinux.org.cn'
  - '+.pkgbuild.com'
  - '+geo.mirror.pkgbuild.com'
  - '+.omarchy.org'
  - '+.github.com'
  - '+github.com'
  - '+objects.githubusercontent.com'
  - '+raw.githubusercontent.com'
  - '+codeload.github.com'
  # TickTick
  - '+.ticktick.com'
  # Strava — must use real CN IP (not proxy) for location / anti-fraud checks
  - '+.strava.com'
  # HuggingFace / LM Studio
  - '+.huggingface.co'
  - '+.hf.co'
  - '+.lmstudio.ai'
  # Cursor / VS Marketplace
  - '+.cursor.sh'
  - '+.cursor.com'
  - '+.cursorapi.com'
  - '+.workos.com'
  - '+.workosdns.com'
  - '+marketplace.visualstudio.com'
  - '+.vscode-cdn.net'
  - '+.gallerycdn.vsassets.io'
  # Discord
  - '+.discord.com'
  - '+.discord.gg'
  - '+.discordapp.com'
  - '+.discordapp.net'
  - '+.discord.media'
  # Anki sync
  - '+.ankiweb.net'
  - '+sync.ankiweb.net'
  - '+ankiweb.net'
  # Steam
  - '+.steampowered.com'
  - '+.steamcommunity.com'
  - '+.steamserver.net'
  - '+.steamstatic.com'
  - '+.valvesoftware.com'
  - '+.steamcontent.com'
  - '+.steam-chat.com'
  - '+steamconnecttest.com'
  - '+.steamgames.com'
  - '+.steamusercontent.com'
  - '+.akamaihd.net'
  - '+.akamaized.net'
  - '+.clngaa.com'
  - '+.eccdnx.com'
  - '+.pphimalayanrt.com'
  - '+.qtlglb.com'
  - '+.ksyna.com'
  - '+.baishangeek.cn'
  - '+.ngaagslb.net'

# prepend-rules order: later proxyfix inserts at top of existing list.
# Policy (2026-08-06):
#   Spotify            → 香港故障转移  (HK on both providers)
#   Claude / Claude Code / Claude Design / Cursor agent / OpenCode → 美国故障转移
#   Large CDN / Steam / HF → DIRECT
#   MATCH default      → 故障转移     (latency auto; often JP)
direct_prepend_rules:
  # --- US AI stack (Claude + Cursor agent + OpenCode) ---
  # 美国故障转移 = us自动切换 → Dualnet美国 → 自动选择 (last hop = degraded JP if all US dead)
  - DOMAIN-SUFFIX,anthropic.com,美国故障转移
  - DOMAIN-SUFFIX,claude.ai,美国故障转移
  - DOMAIN-SUFFIX,claude.com,美国故障转移
  - DOMAIN-SUFFIX,claudeusercontent.com,美国故障转移
  - DOMAIN-KEYWORD,claude,美国故障转移
  - DOMAIN-SUFFIX,cursor.sh,美国故障转移
  - DOMAIN-SUFFIX,cursor.com,美国故障转移
  - DOMAIN-SUFFIX,cursorapi.com,美国故障转移
  - DOMAIN-SUFFIX,workos.com,美国故障转移
  - DOMAIN-SUFFIX,workosdns.com,美国故障转移
  - DOMAIN-SUFFIX,opencode.ai,美国故障转移
  - DOMAIN-SUFFIX,openai.com,美国故障转移
  - PROCESS-NAME,claude,美国故障转移
  - PROCESS-NAME,opencode,美国故障转移
  # --- Spotify HK ---
  - PROCESS-NAME,spotify,香港故障转移
  - PROCESS-NAME-REGEX,(?i)spotify,香港故障转移
  - DOMAIN-SUFFIX,spotify.com,香港故障转移
  - DOMAIN-SUFFIX,scdn.co,香港故障转移
  - DOMAIN-SUFFIX,spotifycdn.com,香港故障转移
  - DOMAIN-SUFFIX,spotifycdn.net,香港故障转移
  - DOMAIN-SUFFIX,pscdn.co,香港故障转移
  - DOMAIN-KEYWORD,spotify,香港故障转移
  # --- DIRECT bypass ---
  - DOMAIN-SUFFIX,strava.com,DIRECT
  - DOMAIN-KEYWORD,strava,DIRECT
  - DOMAIN-SUFFIX,d3nn82uaxijpm6.cloudfront.net,DIRECT
  - DOMAIN-SUFFIX,dgtzuqphqg23d.cloudfront.net,DIRECT
  - DOMAIN-SUFFIX,dgalywyr863hv.cloudfront.net,DIRECT
  - DOMAIN-SUFFIX,d3o5xota0a1fcr.cloudfront.net,DIRECT
  - DOMAIN-SUFFIX,d21y75miwcfqoq.cloudfront.net,DIRECT
  - DOMAIN-SUFFIX,d3u3hkafyj3iak.cloudfront.net,DIRECT
  - DOMAIN-SUFFIX,ngaagslb.net,DIRECT
  - DOMAIN-SUFFIX,baishangeek.cn,DIRECT
  - DOMAIN-SUFFIX,steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcommunity.com,DIRECT
  - DOMAIN-SUFFIX,steamserver.net,DIRECT
  - DOMAIN-SUFFIX,steamstatic.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamusercontent.com,DIRECT
  - DOMAIN-SUFFIX,steamgames.com,DIRECT
  - DOMAIN-SUFFIX,steam-chat.com,DIRECT
  - DOMAIN-SUFFIX,valvesoftware.com,DIRECT
  - DOMAIN-SUFFIX,steamstat.us,DIRECT
  - DOMAIN-SUFFIX,clngaa.com,DIRECT
  - DOMAIN-SUFFIX,eccdnx.com,DIRECT
  - DOMAIN-SUFFIX,pphimalayanrt.com,DIRECT
  - DOMAIN-SUFFIX,qtlglb.com,DIRECT
  - DOMAIN-SUFFIX,ksyna.com,DIRECT
  - DOMAIN-SUFFIX,huggingface.co,DIRECT
  - DOMAIN-SUFFIX,hf.co,DIRECT
  - DOMAIN-SUFFIX,lmstudio.ai,DIRECT
